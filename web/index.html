<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Agent — 运维智能体工作台</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #e4e7ed;
    --text: #1f2329;
    --text-dim: #646a73;
    --accent: #3370ff;
    --rag: #3370ff;
    --agent: #7a3df0;
    --refuse: #e8833e;
    --ok: #34c38f;
    --err: #f5483b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-dim); }
  main { flex: 1; display: flex; overflow: hidden; }
  .chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .side-col { width: 320px; border-left: 1px solid var(--border);
              background: var(--panel); overflow-y: auto; padding: 16px; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 16px; }
  .msg .role { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .msg .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; font-size: 14px;
    line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #eef3ff; border-color: #d6e0ff; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; padding: 3px 8px;
    border-radius: 10px; margin-bottom: 6px;
  }
  .badge.rag { background: #e6efff; color: var(--rag); }
  .badge.agent { background: #f0e9ff; color: var(--agent); }
  .badge.refuse { background: #fdf0e6; color: var(--refuse); }
  .badge .score { font-weight: 400; color: var(--text-dim); }

  .timeline { margin: 6px 0 6px 14px; border-left: 2px solid var(--border);
              padding-left: 14px; }
  .step { margin-bottom: 10px; font-size: 13px; }
  .step .st-head { display: flex; align-items: center; gap: 6px; }
  .step .st-name { font-weight: 600; color: var(--accent); }
  .step .st-params { color: var(--text-dim); font-family: monospace; font-size: 12px; }
  .step .st-result {
    margin-top: 4px; font-family: monospace; font-size: 12px;
    background: #f5f6f7; border-radius: 4px; padding: 6px 8px;
    white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow-y: auto;
  }
  .step .toggle { cursor: pointer; color: var(--text-dim); font-size: 11px; }

  .src-item { font-size: 12px; margin-bottom: 10px; padding: 8px;
              background: #f5f6f7; border-radius: 6px; }
  .src-item .src-id { font-weight: 600; color: var(--accent); }
  .src-item .src-text { color: var(--text-dim); margin-top: 4px; line-height: 1.5; }

  .side-section { margin-bottom: 20px; }
  .side-section h3 { font-size: 12px; color: var(--text-dim);
                     text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
  .stat { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .stat .v { font-weight: 600; }

  footer { background: var(--panel); border-top: 1px solid var(--border);
           padding: 12px 20px; }
  #input-row { display: flex; gap: 10px; }
  #query-input {
    flex: 1; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 14px; outline: none;
  }
  #query-input:focus { border-color: var(--accent); }
  #send-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 0 22px; font-size: 14px; cursor: pointer; font-weight: 500;
  }
  #send-btn:disabled { background: #c0c4cc; cursor: not-allowed; }
  .examples { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .examples span {
    font-size: 12px; color: var(--text-dim); background: #f0f2f5;
    padding: 4px 10px; border-radius: 12px; cursor: pointer;
  }
  .examples span:hover { background: #e4e7ed; }
  .typing::after { content: "▌"; animation: blink 1s infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1>Ops Agent</h1>
  <span class="sub">运维智能体工作台 · RAG直答 / Agent循环 / 拒答转人工</span>
  <span class="sub" style="margin-left:auto"><a href="/report" style="color:var(--accent);text-decoration:none;font-weight:500">评估报告 →</a></span>
  <span class="sub">session: <b id="sid">—</b></span>
</header>
<main>
  <div class="chat-col">
    <div id="messages"></div>
  </div>
  <aside class="side-col">
    <div class="side-section">
      <h3>本次路由</h3>
      <div class="stat"><span>路径</span><span class="v" id="st-route">—</span></div>
      <div class="stat"><span>相似度</span><span class="v" id="st-sim">—</span></div>
      <div class="stat"><span>关键词覆盖</span><span class="v" id="st-kw">—</span></div>
      <div class="stat"><span>工具调用</span><span class="v" id="st-tools">0</span></div>
    </div>
    <div class="side-section">
      <h3>知识库溯源</h3>
      <div id="sources"><div style="color:var(--text-dim);font-size:12px">等待检索…</div></div>
    </div>
  </aside>
</main>
<footer>
  <div id="input-row">
    <input id="query-input" placeholder="输入运维问题，如：mysql 连接数满了怎么办" autocomplete="off">
    <button id="send-btn">发送</button>
  </div>
  <div class="examples">
    <span>mysql too many connections 怎么办</span>
    <span>nginx 502 bad gateway 怎么排查</span>
    <span>昨晚 web-01 为什么变慢</span>
    <span>今天午饭吃什么</span>
  </div>
</footer>

<script>
const ROUTE_LABEL = {rag_direct: "RAG 直答", agent_loop: "Agent 循环", refuse_human: "拒答转人工"};
const ROUTE_CLASS = {rag_direct: "rag", agent_loop: "agent", refuse_human: "refuse"};
let sessionId = "";

const $ = id => document.getElementById(id);
const msgs = $("messages");
const input = $("query-input");
const sendBtn = $("send-btn");

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function scrollBottom(){ msgs.scrollTop = msgs.scrollHeight; }

function addUser(text){
  const d = document.createElement("div"); d.className = "msg user";
  d.innerHTML = `<div class="role">你</div><div class="bubble">${esc(text)}</div>`;
  msgs.appendChild(d); scrollBottom();
}

function startAssistant(){
  const d = document.createElement("div"); d.className = "msg assistant";
  d.id = "cur-msg";
  d.innerHTML = `<div class="role">助手</div>
    <div id="cur-badge"></div>
    <div id="cur-timeline"></div>
    <div class="bubble typing" id="cur-bubble"></div>`;
  msgs.appendChild(d); scrollBottom();
  return d;
}

function setBadge(route, sim, kw){
  const box = $("cur-badge");
  box.innerHTML = `<span class="badge ${ROUTE_CLASS[route]}">
    ${ROUTE_LABEL[route]}
    <span class="score">sim=${sim.toFixed(2)} kw=${kw.toFixed(2)}</span>
  </span>`;
}

function addTimelineStep(name, params, result){
  const tl = $("cur-timeline");
  const sid = "step-" + Math.random().toString(36).slice(2,7);
  const step = document.createElement("div"); step.className = "step";
  step.innerHTML = `
    <div class="st-head">
      <span class="st-name">${esc(name)}</span>
      <span class="st-params">${esc(JSON.stringify(params))}</span>
      <span class="toggle" id="${sid}-tgl">展开结果</span>
    </div>
    <div class="st-result" id="${sid}" style="display:none">${esc(result)}</div>`;
  tl.appendChild(step);
  $(sid+"-tgl").onclick = function(){
    const r = $(sid);
    r.style.display = r.style.display==="none" ? "block" : "none";
    this.textContent = r.style.display==="none" ? "展开结果" : "收起结果";
  };
  // 计数
  $("st-tools").textContent = tl.children.length;
  scrollBottom();
}

function appendAnswer(chunk){
  $("cur-bubble").classList.add("typing");
  $("cur-bubble").textContent += chunk;
  scrollBottom();
}

function finishAnswer(){
  $("cur-bubble").classList.remove("typing");
}

function renderSources(kbHits){
  const box = $("sources");
  if(!kbHits || !kbHits.length){
    box.innerHTML = `<div style="color:var(--text-dim);font-size:12px">本次未命中知识库</div>`;
    return;
  }
  box.innerHTML = kbHits.map(kb => `
    <div class="src-item">
      <div><span class="src-id">${esc(kb.id)}</span>
           <span style="color:var(--text-dim);font-size:11px">sim=${kb.sim}</span></div>
      <div class="src-text">${esc(kb.text).slice(0,120)}…</div>
    </div>`).join("");
}

function updateStats(route, sim, kw){
  $("st-route").textContent = ROUTE_LABEL[route] || route;
  $("st-sim").textContent = sim.toFixed(3);
  $("st-kw").textContent = kw.toFixed(3);
}

function send(query){
  if(!query.trim()) return;
  addUser(query);
  startAssistant();
  sendBtn.disabled = true;
  const url = `/api/chat/stream?query=${encodeURIComponent(query)}&session_id=${encodeURIComponent(sessionId)}`;
  const es = new EventSource(url);
  let doneData = null;

  es.addEventListener("route", e => {
    const d = JSON.parse(e.data);
    setBadge(d.route, d.sim, d.kw_coverage);
    updateStats(d.route, d.sim, d.kw_coverage);
  });
  es.addEventListener("tool_call", e => {
    const d = JSON.parse(e.data);
    addTimelineStep(d.name, d.params, "(执行中…)");
  });
  es.addEventListener("tool_result", e => {
    const d = JSON.parse(e.data);
    // 更新最后一个 step 的结果
    const tl = $("cur-timeline");
    const last = tl.lastChild;
    if(last){
      const res = last.querySelector(".st-result");
      res.textContent = d.result;
    }
  });
  es.addEventListener("answer_chunk", e => {
    const d = JSON.parse(e.data);
    appendAnswer(d.content);
  });
  es.addEventListener("answer_done", () => finishAnswer());
  es.addEventListener("done", e => {
    const d = JSON.parse(e.data);
    doneData = d;
    renderSources(d.kb_hits);
    updateStats(d.route, d.sim, d.kw_coverage);
    es.close();
    sendBtn.disabled = false;
    input.focus();
  });
  es.addEventListener("error", e => {
    // EventSource 的 error 可能是连接关闭或服务端 error 事件
    try {
      const d = JSON.parse(e.data);
      appendAnswer("\n[错误] " + d.message);
    } catch {
      appendAnswer("\n[连接中断]");
    }
    finishAnswer();
    es.close();
    sendBtn.disabled = false;
  });
}

sendBtn.onclick = () => { send(input.value); input.value = ""; };
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !sendBtn.disabled){ sendBtn.click(); }
});
document.querySelectorAll(".examples span").forEach(el => {
  el.onclick = () => { input.value = el.textContent; input.focus(); };
});

// 初始化会话
fetch("/api/sessions/new", {method:"POST"})
  .then(r => r.json())
  .then(d => { sessionId = d.session_id; $("sid").textContent = sessionId; });
</script>
</body>
</html>
